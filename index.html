  <body>
    <div id="root"><p style="color:#D4AF37;padding:24px;font-family:sans-serif;font-size:18px">Loading Vastraveda...</p></div>
    <script>
      // Debug helper: show any startup error on screen instead of a blank page
      (function () {
        function show(msg) {
          var d = document.getElementById('boot-error');
          if (!d) {
            d = document.createElement('pre');
            d.id = 'boot-error';
            d.style.cssText = 'position:fixed;inset:0;z-index:99999;margin:0;padding:16px;overflow:auto;background:#0b0b0b;color:#f5f5f5;font:12px/1.4 monospace;white-space:pre-wrap';
            document.body.appendChild(d);
          }
          d.textContent += msg + '\n\n';
        }
        window.addEventListener('error', function (e) {
          // ignore failed images/fonts/stylesheets; only show real JavaScript errors
          if (!e.error && !e.message) return;
          show('ERROR: ' + (e.message || '') + '\n' + ((e.error && e.error.stack) || (e.filename || '') + ':' + (e.lineno || '')));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('PROMISE ERROR: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
        window.__showBootError = show;
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Self-contained diagnostics: open the site with ?debug=1 to see a status box after 4 seconds
      (function () {
        if (!/[?&]debug/.test(location.search)) return;
        var errs = [];
        window.addEventListener('error', function (e) { if (e.error || e.message) errs.push('ERR: ' + (e.message || '') ); });
        window.addEventListener('unhandledrejection', function (e) { errs.push('PROMISE: ' + (e.reason && (e.reason.message || e.reason))); });
        setTimeout(function () {
          var root = document.getElementById('root');
          var ls = 'ok';
          try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); } catch (e) { ls = 'BLOCKED: ' + e.message; }
          var cs = root ? getComputedStyle(root) : null;
          var lines = [
            'DIAGNOSTICS (screenshot this)',
            'screen: ' + innerWidth + 'x' + innerHeight + ' dpr ' + devicePixelRatio,
            'UA: ' + navigator.userAgent,
            'root children: ' + (root ? root.children.length : 'no root'),
            'root text: ' + (root ? JSON.stringify(root.innerText.slice(0, 80)) : ''),
            'root size: ' + (root ? root.offsetWidth + 'x' + root.offsetHeight : ''),
            'body size: ' + document.body.offsetWidth + 'x' + document.body.offsetHeight,
            'localStorage: ' + ls,
            'online: ' + navigator.onLine,
            'js errors: ' + (errs.length ? errs.join(' | ') : 'none')
          ];
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99998;max-height:60vh;overflow:auto;padding:10px;background:#111;color:#7CFC00;font:11px/1.4 monospace;white-space:pre-wrap;border-top:2px solid #D4AF37';
          d.textContent = lines.join('\n');
          document.body.appendChild(d);
        }, 4000);
      })();
    </script>
